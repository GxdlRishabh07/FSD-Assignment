             ASSIGNMENT 6: REACT COUNTER APP USING USESTATE
             ======================================================== -->
        <section class="assignment-section">
            <h1 class="assignment-title">Assignment 6: React Counter App</h1>
            <p class="assignment-subtitle">
                Counter application using React <code>useState</code> hook with Increment, Decrement, and Reset.
            </p>

            <!-- React root container for Assignment 6 -->
            <div id="react-counter-root"></div>
        </section>

        <footer>
            <p>Full Stack Web Development Lab | Assignment 6</p>
        </footer>
    </div>

    <!-- ========================================================
         REACT CODE FOR ASSIGNMENT 6 (USING BABEL)
         ======================================================== -->
    <script type="text/babel">
        function CounterApp() {
            // useState hook: 'count' current value store karta hai, 'setCount' use modify karta hai
            const [count, setCount] = React.useState(0);

            // Increment Function (Value ko 1 se badhana)
            const handleIncrement = () => {
                setCount(prevCount => prevCount + 1);
            };

            // Decrement Function (Value ko 1 se ghatana)
            const handleDecrement = () => {
                setCount(prevCount => prevCount - 1);
            };

            // Reset Function (Value ko wapas 0 karna)
            const handleReset = () => {
                setCount(0);
            };

            // Dynamic color determine karna value ke hisab se (Positive = Green, Negative = Red, Zero = Blue)
            let colorClass = "counter-zero";
            if (count > 0) {
                colorClass = "counter-positive";
            } else if (count < 0) {
                colorClass = "counter-negative";
            }

            return (
                <div className="counter-container">
                    <p style={{ color: "#718096", fontSize: "0.95rem" }}>
                        Current Value (Managed by <code>useState</code>):
                    </p>

                    {/* Display Number */}
                    <div className={`counter-display ${colorClass}`}>
                        {count}
                    </div>

                    {/* Counter Control Buttons */}
                    <div className="counter-buttons">
                        {/* Decrement Button */}
                        <button
                            className="counter-btn btn-decrement"
                            onClick={handleDecrement}
                        >
                            - Decrement
                        </button>

                        {/* Reset Button */}
                        <button
                            className="counter-btn btn-reset"
                            onClick={handleReset}
                        >
                            ↺ Reset
                        </button>

                        {/* Increment Button */}
                        <button
                            className="counter-btn btn-increment"
                            onClick={handleIncrement}
                        >
                            + Increment
                        </button>
                    </div>
                </div>
            );
        }

        // Render Assignment 6 into its DOM container
        const counterRoot = ReactDOM.createRoot(document.getElementById('react-counter-root'));
        counterRoot.render(<CounterApp />);
    </script>
